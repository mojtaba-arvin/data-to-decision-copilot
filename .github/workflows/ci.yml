name: CI

on:
  push:
    branches: [main, ci/c3-real-ollama-smoke]
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_ollama:
        description: Run the optional real local-model smoke test
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Keep cancellation scoped to one PR/ref; unrelated PRs and lanes never cancel.
concurrency:
  group: d2d-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Ruff, Pyright, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: uv run --locked ruff check .
      - name: Pyright
        run: uv run --locked pyright
      - name: Tests and coverage
        run: uv run --locked pytest --cov=d2d --cov-report=term-missing
      - name: Synthetic performance smoke
        run: uv run --locked python benchmarks/run_benchmark.py --rows 10000 --iterations 5

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: uv sync --locked --all-groups
      - name: Audit installed dependencies
        run: uv run --locked --with pip-audit pip-audit --skip-editable

  package:
    name: Build and installed-wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify installed wheel CLI
        run: uv run --no-project --with dist/*.whl d2d --help
      - name: Upload exact-commit package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  offline-wheelhouse-smoke:
    name: Offline wheelhouse install and demo journey
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download package built from this exact commit
        uses: actions/download-artifact@v4
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Export locked runtime dependencies
        run: uv export --locked --format requirements-txt --no-dev --no-emit-project -o requirements-runtime.txt
      - name: Prepare offline wheelhouse
        run: |
          mkdir wheelhouse
          python -m pip download --only-binary=:all: -r requirements-runtime.txt -d wheelhouse/
          cp dist/*.whl wheelhouse/
      - name: Install exclusively from wheelhouse
        run: |
          python -m venv offline-venv
          offline-venv/bin/python -m pip install --no-index --find-links ./wheelhouse ./wheelhouse/data_to_decision_copilot-*.whl
      - name: Run installed offline demo journey
        run: |
          offline-venv/bin/d2d --help
          offline-venv/bin/d2d demo --output ./offline_demo.duckdb
          offline-venv/bin/d2d schema --catalog ./offline_demo.duckdb
          offline-venv/bin/d2d query --catalog ./offline_demo.duckdb --question "count rows in sales"

  browser-ui:
    name: Browser UI localization and golden path
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache pinned Playwright package
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: playwright-npm-${{ runner.os }}-node22-1.55.0
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-${{ runner.os }}-1.55.0-chromium
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium when browser cache is cold
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Serve browser UI
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory ui >/tmp/d2d-ui.log 2>&1 &
          echo $! > /tmp/d2d-ui.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/d2d-ui.log
          exit 1
      - name: Verify English/Persian RTL and browser golden path
        run: node tests/browser/ui.spec.mjs
      - name: Stop browser UI server
        if: always()
        run: |
          if [ -f /tmp/d2d-ui.pid ]; then kill "$(cat /tmp/d2d-ui.pid)" || true; fi

  real-ollama-smoke:
    name: Optional real Ollama inference
    if: (github.event_name == 'workflow_dispatch' && inputs.run_real_ollama) || github.ref == 'refs/heads/ci/c3-real-ollama-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start local Ollama daemon
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull local model
        run: ollama pull qwen2.5:3b
      - name: Install project
        run: uv sync --locked --all-groups
      - name: Real model to guarded query smoke
        env:
          D2D_OLLAMA_MODEL: qwen2.5:3b
        run: uv run --locked python scripts/ollama_smoke.py
