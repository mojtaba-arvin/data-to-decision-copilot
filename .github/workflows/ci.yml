name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_ollama:
        description: Run the optional real local-model smoke test
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A new commit cancels only the older run for this same PR/ref.
# Separate PRs and independent group lanes never cancel one another.
concurrency:
  group: d2d-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Ruff, Pyright, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: Pyright
        run: uv run pyright
      - name: Tests and coverage
        run: uv run pytest --cov=d2d --cov-report=term-missing

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: uv sync --all-groups
      - name: Audit installed dependencies
        run: uv run --with pip-audit pip-audit --skip-editable

  package:
    name: Build and installed-wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify installed wheel CLI
        if: hashFiles('src/d2d/cli.py') != ''
        run: uv run --no-project --with dist/*.whl d2d --help

  real-ollama-smoke:
    name: Optional real Ollama inference
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_ollama
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start local Ollama daemon
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull local model
        run: ollama pull qwen3:8b
      - name: Install project
        run: uv sync --all-groups
      - name: Real model to guarded query smoke
        env:
          D2D_OLLAMA_MODEL: qwen3:8b
        run: uv run python scripts/ollama_smoke.py
